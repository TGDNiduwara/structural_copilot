name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check . --fix
      - run: ruff format . --check

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mypy
      - run: mypy app.py config.py agent --ignore-missing-imports --follow-imports=skip
      # tools/batch are legacy modules with pre-existing annotation debt;
      # widening this scope is tracked as a follow-up.

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-cov pytest-mock
      - run: python -m py_compile app.py config.py agent/*.py tools/*.py batch/*.py
      - run: python -m pytest tests -v --cov=config --cov=agent --cov-fail-under=30
      # Coverage baseline on the legacy agent package (Robot-bound handlers
      # cannot run on CI). New modules + config individually sit at 85-100%.